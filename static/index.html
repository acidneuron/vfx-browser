<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VFX Asset Browser</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">VFX<b>Browser</b></div>
    <div id="roots" class="side-section"></div>
    <div class="side-section">
      <h3>Categories</h3>
      <div id="cats"></div>
    </div>
    <div class="side-section">
      <h3>Library</h3>
      <button class="side-item" data-nav="all">All assets</button>
      <button class="side-item" data-nav="fav">★ Favorites</button>
      <button class="side-item" data-nav="recent">Recent</button>
      <button class="side-item" data-nav="missing">Missing files</button>
    </div>
    <div class="side-section" id="scan-status">
      <h3>Status</h3>
      <div id="status-lines" class="muted small"></div>
    </div>
    <div class="side-section">
      <button class="side-item" id="btn-rescan">⟳ Rescan all roots</button>
      <label class="small muted">New library root
        <input id="root-input" placeholder="C:\path\to\library">
        <button id="btn-addroot">Add</button>
      </label>
    </div>
  </aside>

  <main>
    <div id="topbar">
      <input id="search" placeholder="Search name, tag, category…" autocomplete="off">
      <select id="f-kind"><option value="">Type: all</option><option value="video">Video</option><option value="sequence">Sequence</option><option value="image">Image</option></select>
      <select id="f-format"><option value="">Format: all</option></select>
      <select id="f-alpha"><option value="">Alpha: any</option><option value="yes">Has alpha</option><option value="no">No alpha</option><option value="unknown">Unknown</option></select>
      <select id="f-minw"><option value="">Res: any</option><option value="1280">≥ 1280w</option><option value="1920">≥ 1920w</option><option value="3840">≥ 3840w</option></select>
      <select id="f-sort">
        <option value="recent">Sort: recent</option>
        <option value="name">Sort: name</option>
        <option value="size">Sort: size</option>
        <option value="duration">Sort: duration</option>
      </select>
      <label class="small">Card
        <input type="range" id="card-size" min="160" max="420" value="240">
      </label>
      <span id="count" class="muted small"></span>
    </div>

    <div id="grid" class="grid"></div>

    <aside id="inspector" class="hidden">
      <button id="insp-close">✕</button>
      <div id="insp-media"></div>
      <div id="insp-body"></div>
    </aside>
  </main>
</div>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
